[build-system]
requires = [
    "scikit-build-core>=1.1",
    "nanobind>=3.1",
    "numpy",
]

build-backend = "scikit_build_core.build"

[project]
name = "neworder"
version = "1.7.2"
authors = [
  { name="Andrew Smith", email="andrew@friarswood.net" },
]
license = "MIT"
license-files = ["LICENCE.md"]
description = "A dynamic microsimulation framework"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.3.3",
  "pandas-stubs",
  "scipy>=1.9.3",
  "matplotlib>=3.6.2",
]

[dependency-groups]
dev = [
  "nanobind>=3.1",
  "pytest>=9.0.3",
  "ruff",
  "pre-commit>=4.5.1",
  "ty>=0.0.34",
  "requests>=2.34.2",  # only needed by docs, but in dev to prevent ty from complaining about docs/macros.py
]
# separate from dev because zensical has no free-threaded wheels, so would be built from source on 3.14t
docs = [
  "zensical>=0.0.68",
  "mkdocstrings-python>=2.0.9",
]

[project.optional-dependencies]
geospatial = [
  "pyogrio>=0.12.0",
  "networkx>3.0",
  "osmnx>=2.0.0",
  "geopandas>=0.12.2",
  "shapely>=2.2.0"
]
parallel-native = [
  "mpi4py>=4.1.2"
]
parallel-openmpi = [
  "openmpi>=5.0.10",
  "mpi4py>=4.1.2"
]

parallel-mpich = [
  "mpich>=5.0.1",
  "mpi4py>=4.1.2"
]

[project.scripts]
neworder-skill = "neworder.skill_cli:main"

[project.urls]
"Homepage" = "https://neworder.readthedocs.io/"
"Bug Tracker" = "https://github.com/virgesmith/neworder/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
# keep the build tree, so that rebuilds are incremental and gcov can find its data
build-dir = "build/{wheel_tag}"
wheel.packages = ["neworder"]
sdist.exclude = ["/.agents", "/.github", "/docs", "/examples", "/paper", "/test"]

[tool.uv]
# rebuild the extension on `uv sync` if any of these change
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/*" }]

[tool.ty.analysis]
# provided by the optional extras, so might not be installed
allowed-unresolved-imports = ["geopandas.**", "mpi4py.**", "networkx.**", "osmnx.**", "shapely.**"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ARG", "B", "C", "E", "F", "I", "N", "PERF", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "N803", "N806"]

[tool.cibuildwheel]
# the interpreters tested in build-test.yml (free-threaded 3.14 and 3.15 need no `enable` flag in cibuildwheel 4)
build = ["cp313-*", "cp314-*", "cp314t-*", "cp315-*"]
# manylinux only - alpine/musl builds aren't tested anywhere
skip = ["*-musllinux_*"]
build-frontend = "build[uv]"
# copy the tests next to the temporary test venv so the installed wheel, not ./neworder, is imported
test-sources = ["test", "pyproject.toml"]
test-requires = "pytest"
test-command = "pytest test"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
