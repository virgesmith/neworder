[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11>=2.13",
    "numpy",
    "pytest"
]

build-backend = "setuptools.build_meta"

[project]
name = "neworder"
version = "1.7.1"
authors = [
  { name="Andrew Smith", email="andrew@friarswood.net" },
]
license = "MIT"
license-files = ["LICENCE.md"]
description = "A dynamic microsimulation framework"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.3.3",
  "pandas-stubs",
  "scipy>=1.9.3",
  "matplotlib>=3.6.2",
]

[dependency-groups]
dev = [
  "pybind11>=2.10.3",
  "pytest>=9.0.3",
  "ruff",
  "zensical>=0.0.43",
  "requests>=2.34.2",
  "pybind11-stubgen>=2.5.5",
  "pre-commit>=4.5.1",
  "ty>=0.0.34",
]

[project.optional-dependencies]
geospatial = [
  "pyogrio>=0.12.0",
  "networkx>3.0",
  "osmnx>=2.0.0",
  "geopandas>=0.12.2",
  "shapely>=2.0.0"
]
parallel-native = [
  "mpi4py>=4.1.2"
]
parallel-openmpi = [
  "openmpi>=5.0.10",
  "mpi4py>=4.1.2"
]

parallel-mpich = [
  "mpich>=5.0.1",
  "mpi4py>=4.1.2"
]

[project.urls]
"Homepage" = "https://neworder.readthedocs.io/"
"Bug Tracker" = "https://github.com/virgesmith/neworder/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ARG", "B", "C", "E", "F", "I", "N", "PERF", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "N803", "N806"]

[tool.cibuildwheel]
# the interpreters tested in build-test.yml (free-threaded 3.14 needs no `enable` flag in cibuildwheel 4)
build = ["cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
# manylinux only - alpine/musl builds aren't tested anywhere
skip = ["*-musllinux_*"]
build-frontend = "build[uv]"
# copy the tests next to the temporary test venv so the installed wheel, not ./neworder, is imported
test-sources = ["test", "pyproject.toml"]
test-requires = "pytest"
test-command = "pytest test"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
