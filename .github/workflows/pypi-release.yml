name: Publish to PyPI

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v1.2.3
      - v*
  # allow the wheels to be built (but not published) on demand
  workflow_dispatch:

jobs:
  wheels:
    name: Build wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v6
      # build-frontend = "build[uv]" requires uv on the runner. The manylinux
      # container already provides one, but the native macos/windows builds don't.
      - name: Install prerequisites
        uses: astral-sh/setup-uv@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        uses: astral-sh/setup-uv@v7
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  deploy:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        uses: astral-sh/setup-uv@v7
      - name: Collect wheels and sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish package to PyPI
        run: uv publish
      - name: zip examples
        run: |
          zip -r examples.zip examples/
          tar czfv examples.tgz examples/
      - name: upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: examples.zip
          path: examples.zip
          # retention-days: 14
      - name: upload tgz artifact
        uses: actions/upload-artifact@v7
        with:
          name: examples.tgz
          path: examples.tgz
