# test in parallel (MPI) mode
name: Parallel (MPI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build
        run: uv sync --dev --extra ${{ runner.os == 'Windows' && 'parallel-mpich' || 'parallel-openmpi' }}
      - name: Test with pytest
        run: |
          uv run mpiexec -n 2 pytest -s
