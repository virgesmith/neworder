name: Code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build
      # uv builds in a temporary directory that is deleted afterwards, but gcov writes its data next to the object
      # files. So rebuild the extension in place with instrumentation, leaving the object files in ./build
      run: |
        uv sync --dev
        CXXFLAGS=--coverage uv run --no-sync --with setuptools python setup.py build_ext --inplace --force
    - name: Test
      run: |
        uv run --no-sync --with pytest-cov pytest --cov=neworder --cov-report=xml:coverage-py.xml
    - name: Report
      run: |
        uvx gcovr --root . --filter src/ --xml coverage-cpp.xml --print-summary build
    - name: Upload C++ coverage
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-cpp.xml
        flags: cpp
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
    - name: Upload Python coverage
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-py.xml
        flags: python
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
