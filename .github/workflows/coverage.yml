name: Code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build
      # uv normally builds in a temporary environment that is deleted afterwards, but gcov needs the nanobind headers
      # at the paths they were compiled from. So rebuild the extension with instrumentation in the project environment.
      # Its data is written next to the object files, in ./build
      run: |
        uv sync --dev --extra geospatial
        uv pip install scikit-build-core
        CXXFLAGS=--coverage SKBUILD_CMAKE_BUILD_TYPE=Debug uv pip install --no-build-isolation --reinstall --no-deps -e .
    - name: Test
      run: |
        uv run --no-sync --with pytest-cov pytest --cov=neworder --cov-report=xml:coverage-py.xml
    - name: Report
      run: |
        uvx gcovr --root . --filter src/ --exclude-unreachable-branches --exclude-throw-branches --xml coverage-cpp.xml --print-summary build
    - name: Upload C++ coverage
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-cpp.xml
        flags: cpp
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
    - name: Upload Python coverage
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-py.xml
        flags: python
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
